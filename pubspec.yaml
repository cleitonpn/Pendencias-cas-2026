name: montagem_uset
description: Gestão de pendências - Montagem USET
publish_to: 'none'
version: 1.0.72+73

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  pdf: ^3.10.8
  share_plus: ^10.0.2
  provider: ^6.1.2
  intl: ^0.19.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  # Chamada às funções de verificação de PIN: o código digitado sobe, o
  # cadastrado nunca desce para o cliente.
  cloud_functions: ^5.1.3
  image_picker: ^1.1.2
  sqflite_common_ffi: ^2.3.4
  # SQLite em WebAssembly, com persistência em IndexedDB. É o que permite o
  # app rodar no navegador com as MESMAS telas do Android: o DatabaseService
  # e as 26 telas que dependem dele ficam intactos.
  sqflite_common_ffi_web: ^0.4.5
  sqlite3_flutter_libs: ^0.5.4+1
  package_info_plus: ^8.0.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
