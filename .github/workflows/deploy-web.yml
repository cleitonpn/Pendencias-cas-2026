name: Deploy Web (Stand)

on:
  push:
    branches:
      - main
      - claude/fair-setup-tracker-app-J9EOm
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Only one deploy at a time — if a newer push comes in, cancel the older run.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Build Flutter Web + Deploy Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Gerar pasta web/
        run: flutter create --platforms=web --project-name=montagem_uset .

      - name: Instalar dependências
        run: flutter pub get

      # Copia sqlite3.wasm e o worker para web/. Sem isso o SQLite não sobe no
      # navegador e o app abre com o banco vazio.
      - name: Preparar SQLite WebAssembly
        run: dart run sqflite_common_ffi_web:setup

      - name: Build Web release
        run: flutter build web --release

      - name: Gravar credencial de serviço
        run: printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # O `|| echo` anterior transformava QUALQUER erro em sucesso: credencial
      # inválida, regra inválida, falta de permissão — tudo virava verde, e o
      # deploy só era descoberto como não aplicado quando alguém reclamava da
      # tela antiga. Agora só a corrida de "versão já ativa" é tolerada; o
      # resto falha o workflow.
      - name: Deploy Hosting + Firestore rules + indexes
        run: |
          set -o pipefail
          if npx --yes firebase-tools@latest deploy \
              --only hosting,firestore:rules,firestore:indexes \
              --project montagem-uset \
              --non-interactive 2>&1 | tee deploy.log; then
            echo "Deploy concluído."
          else
            if grep -qiE "already active|another deploy|concurrent" deploy.log; then
              echo "::warning::Deploy ignorado — outra publicação assumiu a versão (corrida)."
            else
              echo "::error::Deploy falhou. Veja o log acima."
              exit 1
            fi
          fi
          # "Deploy complete!" é o que o firebase-tools imprime ao publicar de
          # fato. Sem essa marca, o passo passou sem publicar nada.
          if ! grep -q "Deploy complete!" deploy.log; then
            echo "::warning::Nenhuma publicação efetiva nesta execução."
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
