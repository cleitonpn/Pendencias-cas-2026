name: Build APK Android

on:
  push:
    branches:
      - main
      - claude/fair-setup-tracker-app-J9EOm
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK 34
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Configurar Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar código Dart
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK release
        run: flutter build apk --release
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: CAS2026-Pendencias-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: CAS2026-Pendencias-APK-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
