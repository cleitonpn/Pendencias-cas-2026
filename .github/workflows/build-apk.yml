name: Build APK Android

on:
  push:
    branches:
      - main
      - claude/fair-setup-tracker-app-J9EOm
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK 34
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Configurar Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar código Dart
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK release
        run: flutter build apk --release
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: CAS2026-Pendencias-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Publica o APK como Release para a atualização automática dentro do app.
      # O app lê a release "latest" e compara o número de build da tag (v<code>).
      - name: Extrair versão do pubspec
        id: ver
        run: |
          LINE=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          echo "name=${LINE%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${LINE##*+}" >> "$GITHUB_OUTPUT"

      - name: Publicar Release com APK
        if: github.ref_name == 'main' || github.ref_name == 'claude/fair-setup-tracker-app-J9EOm'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: ${{ steps.ver.outputs.name }}
          body: "Atualização do app Montagem USET (versão ${{ steps.ver.outputs.name }})."
          make_latest: "true"
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: CAS2026-Pendencias-APK-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Habilitar suporte Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Gerar pasta windows/
        run: flutter create --platforms=windows --project-name=montagem_uset .

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload executável Windows
        uses: actions/upload-artifact@v4
        with:
          name: USET-Pendencias-Windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
