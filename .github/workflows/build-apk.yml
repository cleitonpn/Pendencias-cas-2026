name: Build APK Android

on:
  push:
    branches:
      - main
      - claude/fair-setup-tracker-app-J9EOm
  workflow_dispatch:  # Permite rodar manualmente pelo GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze --no-fatal-warnings

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CAS2026-Pendencias-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build APK debug (mais fácil de instalar sem assinar)
        run: flutter build apk --debug

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: CAS2026-Pendencias-APK-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
